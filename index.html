<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>Document</title>
</head>
<body>
    <main>
        <div class="container">
            <div class = "sideVisual">
                <div class="logo">
                    <img src="odin-logo.png" id="odin">
                    <p class="name">Odin</p>
                </div>
                <div class="citation">
                    <caption>
                    Image by <u>Halie West</u> on Unsplash
                    </caption>
                </div>
            </div>
            <div class = "content">
                <div class = "intro">
                    <p class="clamp">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
                    <p>You <i>know</i> you want to.</p>
                </div>
                <p class="formIntro">Let's do this!</p>
                <div class = "forms">
                    <div class="leftForms">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" class="tBox" id="first_name" maxlength="20" required>
                        <label for="email_name">Email</label>
                        <input type="email" name="email_name" class="tBox" id="email_name" maxlength="30" required>
                        <label for="password">Password</label>
                        <input type="password" name="password" class="tBox" id="password" maxlength="20" required>
                    </div>
                    <div class="rightForms">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" class="tBox" id="last_name" maxlength="20" required >
                        <label for="phone">Phone</label>
                        <input type="number" name="phone" class="tBox" id="phone" maxlength="10" required>
                        <label for="confirm">Confirm Password</label>
                        <input type="password" name="confirm" class="tBox" id="confirm" maxlength="20" required>
                    </div>
                </div>
                <div class="footer">
                    <button class="signUp">Create Account</button>
                    <p class="logPrompt">Already have an account? <a class="login" href="index.html">Log In</a></p>
                   
                </div>
            </div>
        </div>
    </main>
</body>
</html>
